name: Skill site

on:
  push:
    branches:
      - main
    paths:
      # submodule pointer updates (gitlinks); patterns inside a submodule never match in the umbrella
      - 'site'
      - '.github/workflows/skill-site.yml'
      - 'skills'
      - 'tools'
      - 'registry/ai-tools.yaml'
      - '.github/skills/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches:
      - main
    paths:
      # submodule pointer updates (gitlinks); patterns inside a submodule never match in the umbrella
      - 'site'
      - '.github/workflows/skill-site.yml'
      - 'skills'
      - 'tools'
      - 'registry/ai-tools.yaml'
      - '.github/skills/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check-secrets:
    name: Check deployment secret
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      # トークンが無いときは 'false'。verify は走らせ、deploy だけスキップする
      deployable: ${{ steps.token.outputs.available }}
    steps:
      - name: Check AZURE_STATIC_WEB_APPS_API_TOKEN
        id: token
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            msg="AZURE_STATIC_WEB_APPS_API_TOKEN が設定されていないため、スキルサイトのデプロイをスキップしました。デプロイするにはリポジトリの Settings > Secrets and variables > Actions で AZURE_STATIC_WEB_APPS_API_TOKEN シークレットを設定してください。"
            echo "::warning::$msg"
            echo "### Skill site: deploy skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Generate, validate, test, and build
    needs: check-secrets
    if: always() && (needs.check-secrets.result == 'success' || needs.check-secrets.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      # OPENROUTER_API_KEY が無くビルドをスキップしたときは 'false'。deploy はこれを見てスキップする
      built: ${{ steps.key.outputs.available }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Check OPENROUTER_API_KEY
        id: key
        env:
          # OPENROUTER_API_KEY は catalog:build のskill embeddings生成
          # (openai/text-embedding-3-small, via OpenRouter) に必須。
          #
          # 未設定ならジョブを落とさず、警告だけ出して以降のビルド・検証・アップロードと deploy ジョブをスキップする。
          # - fork PR は GitHub Actions の仕様でシークレットを読めず空になる（pull_request_target を使わない限り）
          # - シークレットを登録していないリポジトリ（fork 先や、サイトを公開していない間）でも CI 全体が赤くならない
          # embedding 抜きのビルドは作らないので、不完全な成果物がデプロイされることはない。
          #
          # check-secrets ジョブに混ぜない理由: check-secrets は main への push/workflow_dispatch 限定で、
          # PR ではジョブごと skip されるため、PR でのキーの有無をここで判定できなくなる。
          #
          # 事前に判定する理由: `pnpm run build` に任せると embedding 生成スクリプトの内部で
          # 分かりにくいスタックトレースとして失敗する。
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            msg="OPENROUTER_API_KEY が設定されていないため、スキルサイトのビルド・検証・デプロイをスキップしました。実行するにはリポジトリの Settings > Secrets and variables > Actions で OPENROUTER_API_KEY シークレットを設定してください（catalog:build の埋め込み計算に必要）。"
            echo "::warning::$msg"
            echo "### Skill site: skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Build static site
        if: steps.key.outputs.available == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: pnpm --filter ai-skill-catalog-site run build
      - name: Validate public output
        if: steps.key.outputs.available == 'true'
        run: pnpm --filter ai-skill-catalog-site run validate
      - name: Run publication tests
        if: steps.key.outputs.available == 'true'
        run: pnpm --filter ai-skill-catalog-site run test
      - name: Upload static site artifact
        if: steps.key.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: skills-site-dist
          path: site/skills-site/dist
          retention-days: 1
      - name: Upload API artifact
        if: steps.key.outputs.available == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: skills-site-api
          path: |
            site/skills-site/api
            !site/skills-site/api/node_modules
            !site/skills-site/api/local.settings.json
          retention-days: 1

  deploy:
    name: Deploy to Azure Static Web Apps
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && needs.check-secrets.outputs.deployable == 'true' && needs.verify.outputs.built == 'true'
    needs: [check-secrets, verify]
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: skills-site-dist
          path: site/skills-site/dist
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: skills-site-api
          path: site/skills-site/api
      - name: Deploy generated static files and API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: site/skills-site/dist
          api_location: site/skills-site/api
          output_location: ''
          skip_app_build: true
          # OPENROUTER_API_KEY must be set as an SWA Application setting
          # (Azure Portal → Configuration, or `az staticwebapp appsettings set`).
          # The deployment token cannot inject app settings.
      - name: Tag successful deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tag="deploy-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
