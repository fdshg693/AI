name: Skill site

on:
  push:
    branches:
      - main
    paths:
      - 'skills-site/**'
      - '.github/workflows/skill-site.yml'
      - '.claude/rules/skill-publication.md'
      - '.claude/rules/skills-site-interactive.md'
      - 'claude-plugins/**/skills/**'
      - 'codex-plugins/**/skills/**'
      - 'copilot-plugins/**/skills/**'
      - 'cursor-plugins/**/skills/**'
      - '_agents/plugins/**/skills/**'
      - '.claude/skills/**'
      - '.cline/skills/**'
      - '.github/skills/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'skills-site/**'
      - '.github/workflows/skill-site.yml'
      - '.claude/rules/skill-publication.md'
      - '.claude/rules/skills-site-interactive.md'
      - 'claude-plugins/**/skills/**'
      - 'codex-plugins/**/skills/**'
      - 'copilot-plugins/**/skills/**'
      - 'cursor-plugins/**/skills/**'
      - '_agents/plugins/**/skills/**'
      - '.claude/skills/**'
      - '.cline/skills/**'
      - '.github/skills/**'
      - 'pnpm-workspace.yaml'
      - 'package.json'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  check-secrets:
    name: Verify deployment secret
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Ensure AZURE_STATIC_WEB_APPS_API_TOKEN is set
        env:
          TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::AZURE_STATIC_WEB_APPS_API_TOKEN が設定されていません。リポジトリの Settings > Secrets and variables > Actions で AZURE_STATIC_WEB_APPS_API_TOKEN シークレットを設定してください。"
            exit 1
          fi

  verify:
    name: Generate, validate, test, and build
    needs: check-secrets
    if: always() && (needs.check-secrets.result == 'success' || needs.check-secrets.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Build static site
        run: pnpm --filter ai-skill-catalog-site run build
      - name: Validate public output
        run: pnpm --filter ai-skill-catalog-site run validate
      - name: Run publication tests
        run: pnpm --filter ai-skill-catalog-site run test
      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: skills-site-dist
          path: skills-site/dist
          retention-days: 1
      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: skills-site-api
          path: |
            skills-site/api
            !skills-site/api/node_modules
            !skills-site/api/local.settings.json
          retention-days: 1

  deploy:
    name: Deploy to Azure Static Web Apps
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Download static site artifact
        uses: actions/download-artifact@v4
        with:
          name: skills-site-dist
          path: skills-site/dist
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: skills-site-api
          path: skills-site/api
      - name: Deploy generated static files and API
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: skills-site/dist
          api_location: skills-site/api
          output_location: ''
          skip_app_build: true
          # OPENROUTER_API_KEY must be set as an SWA Application setting
          # (Azure Portal → Configuration, or `az staticwebapp appsettings set`).
          # The deployment token cannot inject app settings.
      - name: Tag successful deployment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          tag="deploy-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA::7}"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "$tag"
