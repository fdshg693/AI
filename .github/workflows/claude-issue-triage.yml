# Claude Code を利用したGithub Action
# 公式ドキュメント
# - https://code.claude.com/docs/en/github-actions
# 参考にしたサンプル
# - https://github.com/anthropics/claude-code-action/blob/main/examples/issue-triage.yml
# `@claude` と Issue にてメンションすることで動作する
# `ANTHROPIC_API_KEY` の設定が必要
name: Claude Issue Triage
description: Run Claude Code for issue triage in GitHub Actions
on:
  issues:
    types: [opened]

jobs:
  triage-issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run Claude Code for Issue Triage
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # このレポジトリ自身のマーケットプレイスを登録する
          plugin_marketplaces: "${{ github.server_url }}/${{ github.repository }}.git"
          # プラグインを登録する
          plugins: "seiwan-marketplace@github-action"          
          prompt: "/github-action:issue-triage REPO: ${{ github.repository }} ISSUE_NUMBER: ${{ github.event.issue.number }}"
          
          allowed_non_write_users: "*" # Required for issue triage workflow, if users without repo write access create issues
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--model claude-sonnet-5 --max-turns 10"