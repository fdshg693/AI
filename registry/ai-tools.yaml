# SSOT for "which AI coding tool has which plugins, and where its marketplace /
# skill-catalog / generated-rules files live" in this repository.
#
# maintenance/scripts/plugin_meta/generate/generate_*.py must read these values
# through maintenance/scripts/plugin_meta/util/ai_tools_config.py instead of
# hardcoding paths or metadata. README.md's "AIツールごとの設定・プラグインルート"
# section is generated from the `readme` block below (see
# maintenance/scripts/plugin_meta/generate/generate_readme_tools_section.py).
#
# Each `plugins` entry describes one plugin/workspace-skill root:
#   - path: repo-relative path to the plugin (or, for tool-root skill folders
#     with no plugin.json/marketplace registration, the tool config dir itself)
#   - kind: "plugin" (has its own manifest, e.g. plugin.json/.codex-plugin) or
#     "workspace" (tool-root skills folder, no manifest, not marketplace-registered)
#   - skills_layout: "subdir" if SKILL.md folders live under <path>/skills, or
#     "direct" if SKILL.md folders are immediate children of <path> itself
# A skill root may be listed under one tool only (skill-tools rejects duplicates).
# Skill bodies live once under skills/ or tools/_plugin/ as Claude Code plugins;
# other tools reach them through:
#   - marketplace.sources: plugin dirs listed in that tool's marketplace. Each
#     dir carries the tool's own manifest (.codex-plugin/plugin.json, root
#     plugin.json for Copilot), maintained with the plugin.
#   - workspace_copies: gitignored copies for tools that only read skills from
#     the workspace root (Cline, Kilo, Antigravity). Written by
#     generate_workspace_copies.py (`just agent-compat-sync`); never edit them.
#     from: skill root to copy from; include: fnmatch patterns on the skill
#     folder name; output_dir: where the skill folders go; plugin_json: optional
#     manifest written at output_dir's parent.

tools:
  claude-code:
    readme:
      config_dirs:
        - path: .claude
          description: "このリポジトリ自体を Claude Code で開発するための設定（rules, workflows 等。hooks/ は skill-tools による自己インストール先）"
      plugin_roots:
        - path: skills/plugins
          description: "Claude Code 用プラグイン本体"
        - path: tools/_plugin
          description: "tools/ の CLI に付属する Claude Code プラグイン（`my-tools`。CLI 前提の使い方スキル）"
        - path: .claude-plugin
          description: "上記プラグイン群をまとめるマーケットプレイス定義（`marketplace.json`）と skill カタログ（`skill-catalog.json`）"
    plugins:
      - path: skills/plugins/ai-tools-knowledge
        kind: plugin
        skills_layout: subdir
      - path: skills/plugins/cicd
        kind: plugin
        skills_layout: subdir
      - path: skills/plugins/cc-knowledge
        kind: plugin
        skills_layout: subdir
      - path: skills/plugins/coding
        kind: plugin
        skills_layout: subdir
      - path: skills/plugins/doc-tools
        kind: plugin
        skills_layout: subdir
      - path: skills/plugins/no-code
        kind: plugin
        skills_layout: subdir
      - path: skills/plugins/others
        kind: plugin
        skills_layout: subdir
      - path: skills/plugins/special
        kind: plugin
        skills_layout: subdir
      - path: skills/plugins/subagents
        kind: plugin
        skills_layout: subdir
      - path: skills/plugins/topics
        kind: plugin
        skills_layout: subdir
      - path: skills/plugins/web-lookup
        kind: plugin
        skills_layout: subdir
      - path: tools/_plugin/my-tools
        kind: plugin
        skills_layout: subdir
    marketplace:
      output_path: .claude-plugin/marketplace.json
      name: seiwan-marketplace
      owner:
        name: Seiwan Maikuma
        email: xingwanmeixiong@gmail.com
      metadata:
        description: "Skills, workflows, and productivity tools"
        version: "1.0.0"
    skill_catalog:
      output_path: .claude-plugin/skill-catalog.json

  cline:
    readme:
      config_dirs:
        - path: .cline
          description: "Cline 用設定。`.cline/skills/` は `skills/plugins/ai-tools-knowledge` から `just agent-compat-sync` で作る gitignore 済みのコピー（手編集しない）"
        - path: .clinerules
          description: "Cline が読むルールファイルの出力先。`AGENTS.md` から `tools/agents-rules` CLI（`agents-rules -t cline`）で生成する。未生成なら存在しない。手編集しない"
    plugins: []
    workspace_copies:
      - from: skills/plugins/ai-tools-knowledge/skills
        include: ["cline-*"]
        output_dir: .cline/skills
    rules_from_agents_md:
      output_dir: .clinerules

  kilo:
    readme:
      config_dirs:
        - path: .kilo
          description: "Kilo Code（CLI/TUI/VS Code拡張）の設定。`.kilo/skills/` は `skills/plugins/ai-tools-knowledge` から `just agent-compat-sync` で作る gitignore 済みのコピー。`.kilo/plugin/` は agent-tooling のフック配置先"
    plugins: []
    workspace_copies:
      - from: skills/plugins/ai-tools-knowledge/skills
        include: ["kilo-*"]
        output_dir: .kilo/skills

  codex:
    readme:
      config_dirs:
        - path: .agents
          description: "Codex が読むマーケットプレイス定義（`.agents/plugins/marketplace.json`）。`skills/plugins/ai-tools-knowledge`（`.codex-plugin/plugin.json` を同梱）を指す。Antigravity ともフォルダ名が競合するため `_agents/` と使い分け（`.agents/README.md` 参照）"
    plugins: []
    marketplace:
      sources:
        - skills/plugins/ai-tools-knowledge
      output_path: .agents/plugins/marketplace.json
      name: seiwan-codex-marketplace
      interface:
        displayName: "Seiwan Codex Marketplace"
      default_category: "Productivity"

  copilot:
    readme:
      config_dirs:
        - path: .github
          description: "Copilot 設定（`copilot/settings.json`）、instructions、マーケットプレイス定義（`plugin/marketplace.json`。`skills/plugins/ai-tools-knowledge` のルート `plugin.json` を指す）、および CI 用 GitHub Actions workflows"
    plugins:
      - path: .github
        kind: workspace
        skills_layout: subdir
    marketplace:
      sources:
        - skills/plugins/ai-tools-knowledge
      output_path: .github/plugin/marketplace.json
      owner:
        name: fdshg693
        url: "https://github.com/fdshg693"
      name: ai-plugins
      metadata:
        description: "GitHub Copilot plugins maintained in the AI research repository."
        version: "1.0.0"
    instructions_from_agents_md:
      output_dir: .github/instructions

  cursor:
    readme:
      config_dirs:
        - path: .cursor
          description: "Cursor が読む設定フォルダ。`.cursor/rules/` はネストした AGENTS.md と重複するため意図的に空（理由は `.cursor/rules/README.md` 参照）。プラグインは `skills/plugins/ai-tools-knowledge`（`.cursor-plugin/plugin.json` を同梱）"
    plugins: []
    rules_from_agents_md:
      output_dir: .cursor/rules

  antigravity:
    readme:
      config_dirs:
        - path: _agents
          description: "Antigravity のワークスペースプラグイン置き場（`_agents/plugins/`）。`antigravity-meta` は `skills/plugins/ai-tools-knowledge` から `just agent-compat-sync` で作る gitignore 済みのコピー。`.agents/` と使い分ける（`_agents/README.md` 参照）"
        - path: .agents/rules
          description: "Antigravity が読むワークスペース Rules。`AGENTS.md` から `tools/agents-rules` CLI で生成する（`.agents/README.md` 参照）。手編集しない"
    plugins: []
    workspace_copies:
      - from: skills/plugins/ai-tools-knowledge/skills
        include: ["antigravity-*", "agy-*"]
        output_dir: _agents/plugins/antigravity-meta/skills
        plugin_json:
          name: antigravity-meta
    rules_from_agents_md:
      output_dir: .agents/rules
