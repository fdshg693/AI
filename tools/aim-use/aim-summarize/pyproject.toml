[project]
name = "aim-summarize"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aim-cli",
]

[project.scripts]
aim-summarize = "aim_summarize.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aim_summarize"]

[tool.uv.sources]
aim-cli = { workspace = true }
