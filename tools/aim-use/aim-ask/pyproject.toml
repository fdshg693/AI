[project]
name = "aim-ask"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aim-cli",
]

[project.scripts]
aim-ask = "aim_ask.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aim_ask"]

[tool.uv.sources]
aim-cli = { workspace = true }
