# Stages run in order (piped); jobs inside a stage run in parallel.
#   1. fix      — files regenerated/patched from staged sources
#   2. format   — prettier/ruff over the staged files (after fixers touched them)
#   3. check    — read-only checks and secret scan over the final staged content
# maintenance/scripts Python jobs are one in-process entry per stage
# (maintenance/scripts/precommit), which applies each task's own staged-path globs.
pre-commit:
  piped: true
  jobs:
    # Runs only on main; failing here stops the piped stages below.
    # A plain `echo ... && exit 1` does not fail on Windows (no shell), so it goes through just.
    - name: block direct commits to main
      only:
        - ref: main
      skip:
        - merge
        - rebase
      run: just --justfile maintenance/scripts/justfile guard-main-branch
    - name: fix
      group:
        parallel: true
        jobs:
          - name: maintenance/scripts precommit fix
            glob:
              - "**/SKILL.md"
              - "**/skills/**"
              - "**/.claude-plugin/plugin.json"
              - "**/.codex-plugin/plugin.json"
              - ".claude-plugin/marketplace.json"
              - "registry/*.yaml"
              - "ai-tools.yaml"
              - "repo-tools.yaml"
              - "repo-workflows.yaml"
              - "repo-hooks.yaml"
              - "tools/**"
              # submodule pointer updates (gitlinks) refresh the umbrella's aggregate outputs
              - "skills"
              - "tools"
              - "agent-compat"
            run: just --justfile maintenance/scripts/justfile precommit-fix
            stage_fixed: true
          - name: regenerate hook generated files
            # agent-tooling sources live in the agent-compat submodule, whose own
            # pre-commit (maintenance/lefthook/submodule.yml) regenerates on them.
            glob:
              - ".claude/rules/**"
            run: just --justfile agent-compat/agent-tooling/justfile generate
            stage_fixed: true
          - name: compile gh-aw workflows
            glob: ".github/workflows/*.md"
            run: just --justfile .github/workflows/justfile compile
            stage_fixed: true
    - name: format
      group:
        parallel: true
        jobs:
          - name: format Markdown with Prettier
            glob:
              - "*.md"
              - "**/*.md"
            run: pnpm run format:staged -- {staged_files}
            stage_fixed: true
          - name: format Python with ruff
            glob:
              - "*.py"
              - "**/*.py"
            run: uv run ruff format {staged_files}
            stage_fixed: true
    - name: check
      group:
        parallel: true
        jobs:
          - name: validate skills plugin index
            run: uv run python maintenance/scripts/precommit/skills_plugin_index.py umbrella
          - name: maintenance/scripts precommit check
            glob:
              - "**/SKILL.md"
              - "registry/repo-tools.yaml"
              - "tools/**/pyproject.toml"
              - "tools/**/package.json"
            run: just --justfile maintenance/scripts/justfile precommit-check
          - name: scan staged files for secrets
            glob:
              - "*"
              - "**/*"
            run: just --justfile maintenance/scripts/justfile scan-staged-secrets

# Junctions (.links.yaml) are hidden from git via info/exclude, so checking out
# a commit that tracks files at a junction path silently writes them into the
# junction's target. This only warns afterwards; see maintenance/docs/repo-layout.md.
post-checkout:
  jobs:
    - name: warn when a checkout wrote through a junction
      run: just --justfile maintenance/scripts/justfile links-post-checkout

commit-msg:
  commands:
    lint-commit-message:
      run: pnpm exec commitlint --edit {1}
